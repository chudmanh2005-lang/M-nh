name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip, Fix Gradle & Build
      run: |
        # Giải nén dự án
        unzip -o AutoCall5_Android_Pr*.zip -d project
        cd project

        # Bỏ qua kiểm tra phiên bản Gradle wrapper bị lỗi
        sed -i 's/gradle-8.9-all.zip/gradle-8.1.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true

        # Cấp quyền thực thi và build APK
        chmod +x gradlew 2>/dev/null || true
        gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: project/app/build/outputs/apk/debug/app-debug.apk
        
