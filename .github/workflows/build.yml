name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Project Structure
      run: |
        mkdir -p app/src/main/java/com/example/autocall5
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml

        [ -f MainActivity.kt ] && cp MainActivity.kt app/src/main/java/com/example/autocall5/
        [ -f AutoCallAccessibilityService.kt ] && cp AutoCallAccessibilityService.kt app/src/main/java/com/example/autocall5/
        [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app/src/main/
        [ -f strings.xml ] && cp strings.xml app/src/main/res/values/
        [ -f themes.xml ] && cp themes.xml app/src/main/res/values/
        [ -f accessibility_service_config.xml ] && cp accessibility_service_config.xml app/src/main/res/xml/

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AutoCall5"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            compileSdkVersion 34
            namespace "com.example.autocall5"

            defaultConfig {
                applicationId "com.example.autocall5"
                minSdkVersion 24
                targetSdkVersion 34
                versionCode 1
                versionName "1.0"
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
